name: Build TROP Market Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Arrange Android project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/agona/tropmarket
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/values
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/agona/tropmarket/MainActivity.kt
          cp build.gradle.kts app/build.gradle.kts
          cp strings.xml app/src/main/res/values/strings.xml
          cp styles.xml app/src/main/res/values/styles.xml
          cp trop_icon.png app/src/main/res/drawable-nodpi/trop_icon.png
          cat > build.gradle.kts <<'ROOT'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          ROOT
      - name: Build APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TROP-Market-Uganda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
